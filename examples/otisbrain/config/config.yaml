log_level: info
metrics_port: 8080
namespace: default
kubeconfig: ""

llm:
  model: gpt-4o-mini
  api_key: ""
  base_url: ""
  enabled: true

rules:
  alert_rules_file: "./rules/alert_rules.yaml"
  remediation_rules_file: "./rules/remediation_rules.yaml"

basic:
  interval_seconds: 30
  max_retries: 3
  dry_run: false

monitoring:
  enable_monitor: true
  enable_alert: true
  enable_remediation: false
  enable_decision: false
  namespace: default
  kubeconfig: ""
  metrics_port: 8080
  aggregation_interval_minutes: 10