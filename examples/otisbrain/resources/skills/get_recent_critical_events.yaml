name: get_recent_critical_events
description: 获取近期关键异常事件信息
version: 1.0.0
author: OtisBrain Team
category: monitoring
tags: [kubernetes, monitoring, alerts, events]

inputs:
  - name: time_range
    type: string
    required: false
    default: "last_hour"
    description: 时间范围 (last_hour, last_6_hours, last_24_hours, custom)
  - name: severity
    type: string
    required: false
    default: "all"
    description: 严重级别 (critical, warning, info, all)
  - name: resource_type
    type: string
    required: false
    default: "all"
    description: 资源类型 (pod, deployment, service, all)

outputs:
  - name: events
    type: array
    description: 关键事件列表
  - name: summary
    type: string
    description: 事件摘要
  - name: recommendations
    type: array
    description: 处理建议

execution:
  type: function_call
  function: getRecentCriticalEvents
  parameters:
    time_range: "{{ inputs.time_range }}"
    severity: "{{ inputs.severity }}"
    resource_type: "{{ inputs.resource_type }}"

metadata:
  created_at: "2026-01-31"
  updated_at: "2026-01-31"
  compatibility:
    - trpc-agent-go >= 1.0.0
  dependencies: []